services:
  bot:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: comsbot
      POSTGRES_PASSWORD: comsbot_password
      POSTGRES_DB: comsbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comsbot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: