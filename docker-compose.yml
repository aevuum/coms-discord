services:
  bot:
    build: .
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
    restart: unless-stopped
    ports:
      - "51212:51212"
    develop:
      watch:
        - path: ./src
          target: /app/src
          action: sync+restart

        - path: ./prisma
          target: /app/prisma
          action: sync+restart

        - path: ./package.json
          target: /app/package.json
          action: rebuild

        - path: ./tsconfig.json
          target: /app/tsconfig.json
          action: rebuild

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    restart: unless-stopped
    volumes:
      - coms-postgres-data:/var/lib/postgresql/data

volumes:
  coms-postgres-data:
    name: coms-postgres-data
