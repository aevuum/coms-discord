services:
  bot:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped
    develop:
      watch:
        - path: ./src
          target: /app/src
          action: sync

        - path: ./prisma
          target: /app/prisma
          action: sync+restart

        - path: ./package.json
          target: /app/package.json
          action: rebuild

        - path: ./tsconfig.json
          target: /app/tsconfig.json
          action: rebuild

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: comsbot
      POSTGRES_PASSWORD: comsbot_password
      POSTGRES_DB: comsbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comsbot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: